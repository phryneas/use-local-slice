name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact version, e.g. 1.3.0 or 1.4.0-beta.1'
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Set version
        id: version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          npm version "$RELEASE_VERSION" --no-git-tag-version --allow-same-version --ignore-scripts
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          import pkg from './package.json' with { type: 'json' };
          const { version } = pkg;
          if (version !== process.env.RELEASE_VERSION) {
            throw new Error('Enter an exact version without a v prefix');
          }
          const prerelease = version.includes('-');
          appendFileSync(process.env.GITHUB_OUTPUT,
            `tag=v${version}\nnpm_tag=${prerelease ? 'next' : 'latest'}\nprerelease=${prerelease}\n`);
          NODE

      - name: Install dependencies
        run: |
          npm install --global yarn@1.22.22
          yarn install --frozen-lockfile --non-interactive

      - name: Test and build
        run: |
          yarn test
          yarn build
          npm pack --dry-run

      - name: Commit and tag
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json
          git commit --allow-empty -m "chore: release $RELEASE_TAG"
          git tag "$RELEASE_TAG"
          git push --atomic origin HEAD:refs/heads/main "refs/tags/$RELEASE_TAG"

      - name: Stage on npm
        env:
          NPM_TAG: ${{ steps.version.outputs.npm_tag }}
        run: npm stage publish --access public --tag "$NPM_TAG"

      - name: Create GitHub Release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        with:
          script: |
            await github.rest.repos.createRelease({
              ...context.repo,
              tag_name: process.env.RELEASE_TAG,
              name: process.env.RELEASE_TAG,
              prerelease: process.env.PRERELEASE === 'true',
              generate_release_notes: true
            });
